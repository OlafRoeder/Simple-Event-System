plugins {
    id 'java-library'
    id 'io.freefair.lombok' version '9.8.2'
}

group = 'de.olaf-roeder'
version = '0.2'

java {
    toolchain { languageVersion = JavaLanguageVersion.of(27) }
    withSourcesJar()
    withJavadocJar()
}

// Preserve the library's Java 11 bytecode baseline while compiling with JDK 27.
tasks.named('compileJava', JavaCompile) { options.release = 11 }
lombok { version = '1.18.48' }
tasks.named('updateDaemonJvm') { toolchainPlatforms = [] }

repositories { mavenCentral() }

dependencies {
    implementation 'org.slf4j:slf4j-api:2.0.20'
    implementation platform('org.apache.logging.log4j:log4j-bom:2.26.1')
    implementation 'org.apache.logging.log4j:log4j-api'
    runtimeOnly 'org.apache.logging.log4j:log4j-core'
    runtimeOnly 'org.apache.logging.log4j:log4j-slf4j2-impl'

    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.awaitility:awaitility:4.3.0'
}

test { useJUnitPlatform() }
